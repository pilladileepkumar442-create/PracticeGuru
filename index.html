        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        shake: { '0%, 100%': { transform: 'translateX(0)' }, '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-8px)' }, '20%, 40%, 60%, 80%': { transform: 'translateX(8px)' } },
                        pop: { '0%': { transform: 'scale(0.95)' }, '50%': { transform: 'scale(1.05)' }, '100%': { transform: 'scale(1)' } },
                        spinSlow: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
                        spinSlowReverse: { '0%': { transform: 'rotate(360deg)' }, '100%': { transform: 'rotate(0deg)' } },
                        bob: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-15px)' } },
                        robotHappy: { '0%, 100%': { transform: 'translateY(0) scale(1)' }, '50%': { transform: 'translateY(-40px) scale(1.2)' } },
                        robotFall: { '0%': { transform: 'translateY(0) rotate(0deg)', opacity: 1 }, '100%': { transform: 'translateY(150vh) rotate(180deg)', opacity: 0 } },
                        thunder: { '0%, 100%': { opacity: 0 }, '10%, 30%': { opacity: 0.8 }, '20%, 40%': { opacity: 0.2 } },
                        scanLine: { '0%': { top: '-10%' }, '100%': { top: '110%' } }
                    },
                    animation: {
                        shake: 'shake 0.5s ease-in-out', pop: 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        spinSlow: 'spinSlow 40s linear infinite', spinSlowReverse: 'spinSlowReverse 50s linear infinite',
                        bob: 'bob 3s ease-in-out infinite', robotHappy: 'robotHappy 0.4s ease-in-out infinite',
                        robotFall: 'robotFall 1s ease-in forwards', thunder: 'thunder 0.6s ease-out',
                        scanLine: 'scanLine 6s linear infinite'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            /* FIXED DARK & SKY BLUE THEME */
            --t-bg: #0B1120; /* Very Dark Slate */
            --t-grid: rgba(56, 189, 248, 0.08);
            --t-main: #38BDF8; /* Sky Blue */
            --t-main-glow: rgba(56, 189, 248, 0.4);
            --t-main-dark: #0369A1; /* Dark Sky Blue */
            --t-text: #F8FAFC;
        }

        .hidden-element { display: none !important; }
        
        body { 
            font-family: 'Consolas', 'Courier New', monospace; 
            background-color: var(--t-bg); color: var(--t-text); overflow-x: hidden; min-height: 100vh; 
            background-image: 
                linear-gradient(var(--t-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--t-grid) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .scanner { width: 100%; height: 2px; background: var(--t-main-glow); box-shadow: 0 0 20px 5px var(--t-main-glow); position: fixed; z-index: -1; pointer-events: none;}
        .gear-bg { position: fixed; font-size: 60rem; color: var(--t-grid); z-index: -2; pointer-events: none; line-height: 1; text-shadow: 0 0 50px var(--t-grid);}
        #thunder-overlay { position: fixed; inset: 0; background-color: #E0F2FE; z-index: 40; pointer-events: none; mix-blend-mode: overlay; opacity: 0; }

        .dash-card {
            background: rgba(2, 6, 23, 0.8); border: 1px solid rgba(255,255,255,0.1); 
            border-left: 4px solid var(--t-main); border-radius: 8px; padding: 15px;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: center;
        }
        .dash-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px var(--t-main-glow); border-color: var(--t-main); }
        .dash-card:active { transform: translateY(0); }

        .path-line { position: absolute; width: 4px; background-color: var(--t-main); z-index: 0; left: 50%; transform: translateX(-50%); box-shadow: 0 0 10px var(--t-main); top: 20px; bottom: 20px;}
        
        .level-node {
            width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: bold; position: relative; z-index: 10;
            background: rgba(2, 6, 23, 0.9); border: 2px solid var(--t-main-dark);
            box-shadow: 0 5px 0 var(--t-main-dark); transition: all 0.1s;
        }
        .level-node.completed { border-color: var(--t-main); background: var(--t-main-dark); color: white; box-shadow: 0 5px 0 var(--t-main); text-shadow: 0 0 10px white;}
        .level-node.active { border-color: var(--t-main); background: var(--t-main); color: #000; box-shadow: 0 5px 0 #ffffff, 0 0 20px var(--t-main); transform: scale(1.1); cursor: pointer;}
        .level-node.active:active { box-shadow: 0 0px 0 #ffffff, 0 0 20px var(--t-main); transform: scale(1.1) translateY(5px); }
        .level-node.locked { border-color: #1E293B; background: #0F172A; color: #475569; box-shadow: 0 5px 0 #020617; opacity: 0.7;}

        .btn-sys { border-bottom-width: 4px; transition: all 0.1s; background-color: var(--t-main); border-color: var(--t-main-dark); color: #000;}
        .btn-sys:active:not(:disabled) { border-bottom-width: 0px; transform: translateY(4px); }
        
        .btn-scenario { background: rgba(2, 6, 23, 0.8); border: 1px solid var(--t-main); border-left-width: 4px; transition: all 0.1s; box-shadow: 0 0 10px var(--t-grid); }
        .btn-scenario:hover:not(:disabled) { background: var(--t-main-glow); box-shadow: 0 0 15px var(--t-main-glow); }

        .glass-card { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(12px); border: 1px solid #1E293B; box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 20px var(--t-grid); }

        .word-block { background-color: #0F172A; color: var(--t-main); font-weight: bold; font-size: 1.1rem; font-family: sans-serif; padding: 10px 18px; border-radius: 4px; cursor: pointer; border: 1px solid var(--t-main); box-shadow: 0 0 8px var(--t-grid); transition: all 0.1s; display: inline-block; margin: 6px; }
        .word-block:hover { background-color: var(--t-main-glow); }
        .word-block:active { transform: scale(0.95); }
        .word-block.used { background-color: #020617; color: #1E293B; border-color: #1E293B; box-shadow: none; cursor: default; }
        
        .answer-zone { min-height: 80px; border-bottom: 1px solid #1E293B; display: flex; flex-wrap: wrap; align-items: center; padding: 10px 0; gap: 10px; }
        
        .chat-bubble-boss { background: rgba(255, 255, 255, 0.05); padding: 12px 18px; border-radius: 0 16px 16px 16px; max-width: 80%; border: 1px solid rgba(255,255,255, 0.1); margin-bottom: 12px;}
        .chat-bubble-user { background: var(--t-main-glow); padding: 12px 18px; border-radius: 16px 0 16px 16px; max-width: 80%; align-self: flex-end; border: 1px solid var(--t-main); margin-bottom: 12px; font-family: sans-serif; color: #fff;}

        #robot-mascot { text-shadow: 0 0 20px var(--t-main); }
    </style>
</head>

            <div class="flex items-center text-white bg-black/50 px-4 py-1 rounded border border-[#1E293B]" style="color: var(--t-main);">

        </div>
    </nav>

    </main>

            </div>

            </div>

                <div>

                    <p id="drill-prompt" class="text-lg text-white/90"></p>
                </div>
            </div>

            <div id="mechanic-builder" class="hidden-element">

            </div>

            let array = [...arr];

                const yesterday = new Date(Date.now() - 86400000).toDateString();
                if (lastDate === yesterday) {
                    progressData._streak = (progressData._streak || 0) + 1;
                } else if (lastDate !== '') {
                    progressData._streak = 1; // streak broken
                } else {
                    progressData._streak = 1; // first day
                }
                progressData._lastPracticeDate = today;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progressData));
            }
        }

        function getTotalPractices() {
            let total = 0;
            for (let key in generators) {
                total += (progressData[key] || 0);
            }
            return total;
        }

        // --- RESET PROGRESS ---
        function resetProgress() {
            if (confirm('⚠️ Are you sure you want to reset ALL progress? This cannot be undone!')) {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem('techEnglishFinal_v6');
                progressData = { totalXP: 0 };
                deckIndices = {};
                renderDashboard();
            }
        }

        // --- SOUND FEEDBACK (Web Audio API - no external files needed) ---
        function playSound(isCorrect) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                gain.gain.value = 0.15;
                
                if (isCorrect) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, ctx.currentTime);      // C5
                    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2); // G5
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch(e) { /* Audio not supported, silently fail */ }
        }
        
        
        // --- QUICK MIX MODE ---
        function startQuickMix() {
            const catKeys = Object.keys(generators);
            const randomCat = catKeys[Math.floor(Math.random() * catKeys.length)];
            currentCategory = randomCat;
            startGame();
        }

        function renderDashboard() {
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            document.getElementById('dashboard-view').classList.remove('hidden-element');
            document.getElementById('path-view').classList.add('hidden-element');
            document.getElementById('game-view').classList.add('hidden-element');
            document.getElementById('back-btn').classList.add('hidden-element');
            
            // Generate a random seed for this session to shuffle colors
            const sessionColors = ['#38BDF8', '#818CF8', '#A78BFA', '#34D399', '#F472B6', '#FBBF24'];
            const randomColor = sessionColors[Math.floor(Math.random() * sessionColors.length)];
            
            // Randomize order of cards for dynamic feel
            const categories = Object.keys(generators);
            const shuffledCategories = shuffle([...categories]);

            shuffledCategories.forEach((key, index) => {
                const cat = generators[key];
                let card = document.createElement('div');
                let completed = progressData[key] || 0;
                let lvl = Math.floor(completed / DRILLS_PER_LEVEL) + 1;
                
                // Varied border colors based on index to make it look dynamic
                const borderColor = sessionColors[index % sessionColors.length];
                
                card.className = "dash-card p-6 flex flex-col items-center justify-center space-y-4 hover:scale-105 transition-transform cursor-pointer border-t-2";
                card.style.borderTopColor = borderColor;
                card.onclick = () => showPath(key);
                card.innerHTML = `
                    <div class="text-4xl">${cat.icon}</div>
                    <h2 class="text-lg font-bold text-white tracking-widest uppercase">${cat.title}</h2>
                    <div class="text-xs bg-black/60 px-3 py-1 rounded text-slate-300 border border-[#1E293B]">
                        LVL ${lvl} <span class="mx-1">|</span> ${completed} XP
                    </div>
                `;
                container.appendChild(card);
            });
            document.getElementById('total-xp-display').innerText = progressData.totalXP || 0;
            document.getElementById('streak-display').innerText = progressData._streak || 0;
            document.getElementById('total-practices-display').innerText = getTotalPractices();
            
            // Change the main theme color slightly each visit for a fresh feel
            document.documentElement.style.setProperty('--t-main', randomColor);
        }

        function showDashboard() {
            document.getElementById('game-view').classList.add('hidden-element');
            document.getElementById('path-view').classList.add('hidden-element');
            document.getElementById('dashboard-view').classList.remove('hidden-element');
            document.getElementById('back-btn').classList.add('hidden-element');
            document.getElementById('nav-title').innerHTML = '<span class="mr-2 animate-pulse text-white">🔴</span> SOC TERMINAL';
            
            const robot = document.getElementById('robot-mascot');
            robot.innerText = '🤖';
            robot.className = "fixed right-6 bottom-10 text-[5rem] z-50 animate-bob transition-all duration-300 pointer-events-none";
            
            renderDashboard();
        }

        function showPath(categoryKey) {
            currentCategory = categoryKey;
            document.getElementById('dashboard-view').classList.add('hidden-element');
            document.getElementById('path-view').classList.remove('hidden-element');
            document.getElementById('game-view').classList.add('hidden-element');
            document.getElementById('back-btn').classList.remove('hidden-element');
            document.getElementById('back-btn').onclick = showDashboard;
            
            const cat = generators[categoryKey];
            document.getElementById('nav-title').innerText = "MODULE: " + cat.title;
            document.getElementById('path-module-title').innerText = cat.title;

            renderPathLine(categoryKey);
        }

        function renderPathLine(categoryKey) {
            const container = document.getElementById('path-nodes-container');
            container.innerHTML = '<div class="path-line"></div>'; 
            
            let currentLvl = Math.min(Math.floor((progressData[categoryKey] || 0) / DRILLS_PER_LEVEL) + 1, MAX_LEVELS);
            
            for(let i=1; i<=MAX_LEVELS; i++) {
                let div = document.createElement('div');
                div.className = "relative flex flex-col items-center";
                
                let offset = (i % 4 === 1) ? -40 : (i % 4 === 3) ? 40 : 0;
                div.style.transform = `translateX(${offset}px)`;

                let statusClass = "";
                let iconText = i;
                
                if (i < currentLvl) {
                    statusClass = "completed";
                    iconText = "✔️";
                } else if (i === currentLvl) {
                    statusClass = "active";
                    iconText = "▶";
                } else {
                    statusClass = "locked";
                    iconText = "🔒";
                }

                div.innerHTML = `
                    <div class="text-xs font-bold uppercase tracking-widest mb-1 ${i === currentLvl ? 'text-white' : 'text-slate-500'}" ${i===currentLvl ? 'style="color: var(--t-main);"' : ''}>Level ${i}</div>
                    <div class="level-node ${statusClass}" ${(i === currentLvl || i < currentLvl) ? `onclick="startGame()" style="cursor:pointer;"` : ''}>
                        ${iconText}
                    </div>
                `;
                container.appendChild(div);
            }

            setTimeout(() => {
                let activeNode = document.querySelector('.level-node.active');
                if(activeNode) activeNode.scrollIntoView({behavior: "smooth", block: "center"});
            }, 100);
        }

        function startGame() {
            document.getElementById('path-view').classList.add('hidden-element');
            document.getElementById('game-view').classList.remove('hidden-element');
            document.getElementById('back-btn').onclick = () => showPath(currentCategory);
            
            const cat = generators[currentCategory];
            document.getElementById('card-icon').innerText = cat.icon;
            document.getElementById('card-title').innerText = cat.title;

            document.getElementById('mechanic-builder').classList.add('hidden-element');
            document.getElementById('mechanic-scenario').classList.add('hidden-element');
            document.getElementById('mechanic-chat').classList.add('hidden-element');
            document.getElementById('prompt-container').classList.remove('hidden-element');
            document.getElementById('action-check').classList.add('hidden-element');

            if(cat.type === 'builder') {
                document.getElementById('mechanic-builder').classList.remove('hidden-element');
                document.getElementById('action-check').classList.remove('hidden-element');
                loadBuilder(getNextExercise(currentCategory));
            } else if (cat.type === 'scenario') {
                document.getElementById('mechanic-scenario').classList.remove('hidden-element');
                loadScenario(getNextExercise(currentCategory));
            } else if (cat.type === 'story') {
                document.getElementById('prompt-container').classList.add('hidden-element');
                document.getElementById('mechanic-chat').classList.remove('hidden-element');
                currentStoryObj = getNextExercise(currentCategory);
                currentExercise = currentStoryObj;
                currentStoryIndex = 0;
                document.getElementById('chat-history').innerHTML = `<div class="chat-bubble-boss font-bold" style="color: var(--t-main);">${currentStoryObj.initPrompt}</div>`;
                loadStoryStep();
            }
            updateGameUI();
        }

        function updateGameUI() {
            let prog = progressData[currentCategory] % DRILLS_PER_LEVEL;
            let percent = (prog / DRILLS_PER_LEVEL) * 100;
            document.getElementById('game-progress-text').innerText = prog;
            document.getElementById('game-progress-max').innerText = DRILLS_PER_LEVEL;
            document.getElementById('game-progress-bar').style.width = percent + '%';
        }

        function resetGameUI() {
            document.getElementById('feedback-block').classList.add('hidden-element');
            if(generators[currentCategory].type === 'builder') document.getElementById('action-check').classList.remove('hidden-element');
            document.getElementById('action-continue').classList.add('hidden-element');
            document.getElementById('game-card').className = "glass-card p-6 md:p-8 rounded-xl text-center relative transition-colors duration-300";
            
            const robot = document.getElementById('robot-mascot');
            robot.innerText = '🤖';
            robot.className = "fixed right-6 bottom-10 text-[5rem] z-50 animate-bob transition-all duration-300 pointer-events-none";
            document.getElementById('thunder-overlay').classList.remove('animate-thunder');
        }

        function loadBuilder(exerciseData) {
            currentExercise = exerciseData; targetSentence = exerciseData.target;
            document.getElementById('drill-prompt').innerText = exerciseData.p;
            
            let words = targetSentence.split(" ").concat(exerciseData.extras);
            availableWords = shuffle(words).map((word, idx) => ({ id: idx, word: word, used: false }));
            selectedWords = [];
            resetGameUI(); renderWords();
        }

        function renderWords() {
            const bank = document.getElementById('word-bank'); const zone = document.getElementById('answer-zone');
            bank.innerHTML = ''; zone.innerHTML = '';

            selectedWords.forEach(sw => {
                let btn = document.createElement('div'); btn.className = 'word-block'; btn.innerText = sw.word;
                btn.onclick = () => { let aw = selectedWords.splice(selectedWords.findIndex(w => w.id === sw.id), 1)[0]; availableWords.find(w => w.id === aw.id).used = false; renderWords(); };
                zone.appendChild(btn);
            });

            availableWords.forEach(aw => {
                let btn = document.createElement('div'); btn.className = `word-block ${aw.used ? 'used' : ''}`; btn.innerText = aw.word;
                if (!aw.used) btn.onclick = () => { let awd = availableWords.find(w => w.id === aw.id); awd.used = true; selectedWords.push(awd); renderWords(); };
                bank.appendChild(btn);
            });

            let btnCheck = document.getElementById('btn-check');
            if (selectedWords.length > 0) { btnCheck.classList.remove('opacity-50', 'cursor-not-allowed'); btnCheck.disabled = false; } 
            else { btnCheck.classList.add('opacity-50', 'cursor-not-allowed'); btnCheck.disabled = true; }
        }

        function checkBuilderAnswer() {
            let isCorrect = selectedWords.map(w => w.word).join(" ").toLowerCase() === targetSentence.toLowerCase();
            showFeedback(isCorrect, isCorrect ? "Syntax Verified." : "Syntax Error.", isCorrect ? "Sentence built correctly." : `Expected Output: "${targetSentence}"`, () => loadBuilder(currentExercise));
        }

        function loadScenario(exerciseData) {
            currentExercise = exerciseData;
            document.getElementById('drill-prompt').innerText = exerciseData.p;
            
            let opts = shuffle([...exerciseData.opts]);
            for(let i=0; i<3; i++) {
                let btn = document.getElementById(`btn-opt-${i}`);
                btn.innerText = opts[i].t;
                btn.className = "btn-scenario w-full p-4 text-left text-white font-sans rounded";
                btn.onclick = () => checkScenarioAnswer(opts[i]);
            }
            resetGameUI();
        }

        function checkScenarioAnswer(selectedOpt) {
            showFeedback(selectedOpt.correct, selectedOpt.correct ? "Response Accepted." : "Response Denied.", selectedOpt.msg, () => loadScenario(currentExercise));
        }

        function loadStoryStep() {
            let step = currentStoryObj.steps[currentStoryIndex];
            let optsDiv = document.getElementById('chat-options');
            optsDiv.innerHTML = '';
            
            let normalizedOpts = step.opts.map((item, idx) => {
                let text = typeof item === 'object' ? item.t : item;
                let isCorrect = typeof item === 'object' ? (item.correct === true) : (idx === step.correctIdx);
                return { text: text, isCorrect: isCorrect };
            });
            
            let shuffledOpts = shuffle(normalizedOpts);
            
            shuffledOpts.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = "btn-scenario w-full p-3 text-left text-white font-sans rounded text-sm";
                btn.innerText = opt.text;
                btn.onclick = () => {
                    optsDiv.innerHTML = ''; // FIX: Prevent rapid-click double execution race condition
                    if(opt.isCorrect) {
                        document.getElementById('chat-history').innerHTML += `<div class="chat-bubble-user animate-pop">${opt.text}</div>`;
                        currentStoryIndex++;
                        if(currentStoryIndex < currentStoryObj.steps.length) {
                            setTimeout(() => {
                                document.getElementById('chat-history').innerHTML += `<div class="chat-bubble-boss font-bold animate-pop" style="color: var(--t-main);">${currentStoryObj.steps[currentStoryIndex].bossResp}</div>`;
                                document.getElementById('mechanic-chat').scrollTop = document.getElementById('mechanic-chat').scrollHeight;
                                loadStoryStep();
                            }, 600);
                        } else {
                            setTimeout(() => showFeedback(true, "Incident Resolved.", "You successfully handled the incident report.", null), 600);
                        }
                    } else {
                        btn.className = "w-full p-3 text-left text-white font-sans rounded text-sm bg-red-900 border-red-500";
                        optsDiv.appendChild(btn); // Re-append only the wrong button for visual feedback
                        setTimeout(() => showFeedback(false, "Communication Failure.", "That was not the appropriate professional response.", () => {
                            document.getElementById('chat-history').innerHTML = `<div class="chat-bubble-boss font-bold" style="color: var(--t-main);">${currentStoryObj.initPrompt}</div>`;
                            currentStoryIndex = 0;
                            loadStoryStep();
                        }), 600);
                    }
                };
                optsDiv.appendChild(btn);
            });
            document.getElementById('mechanic-chat').scrollTop = document.getElementById('mechanic-chat').scrollHeight;
            resetGameUI();
        }

        
        function showFeedback(isCorrect, titleTxt, msgTxt, retryFunc) {
            playSound(isCorrect);
            const feedback = document.getElementById('feedback-block');
            document.getElementById('action-check').classList.add('hidden-element');
            
            if(generators[currentCategory].type === 'scenario') document.getElementById('mechanic-scenario').classList.add('hidden-element');
            if(generators[currentCategory].type === 'builder') document.getElementById('mechanic-builder').classList.add('hidden-element');
            if(generators[currentCategory].type === 'story') document.getElementById('chat-options').innerHTML = '';

            document.getElementById('action-continue').classList.remove('hidden-element');
            feedback.classList.remove('hidden-element');

            let btnContinue = document.getElementById('btn-continue');
            const robot = document.getElementById('robot-mascot');

            // --- KEYWORD EXPLANATION LOGIC ---
            let tipHtml = '';
            let sentenceToCheck = (currentExercise && currentExercise.target) ? currentExercise.target : '';
            if(!sentenceToCheck && currentExercise && currentExercise.opts) {
                // Get the text of the correct option for scenarios
                let correctOpt = currentExercise.opts.find(o => o.correct === true);
                if(correctOpt) sentenceToCheck = correctOpt.t;
            }
            if(sentenceToCheck) {
                for (let key in techDictionary) {
                    // Match whole word case-insensitive
                    const regex = new RegExp('\\b' + key + '\\b', 'i');
                    if (regex.test(sentenceToCheck)) {
                        tipHtml = `<div class="mt-3 pt-3 border-t border-slate-700/50 text-sm">
                            <span class="text-slate-400">💡 Tech Vocab:</span> 
                            <strong style="color: var(--t-main);">${key}</strong> - ${techDictionary[key]}
                        </div>`;
                        break; // Just show one tip
                    }
                }
            }
            // ---------------------------------

            if (isCorrect) {
                document.getElementById('game-card').classList.add('animate-pop');
                document.getElementById('game-card').style.borderColor = "var(--t-main)";
                feedback.style.backgroundColor = "var(--t-main-dark)";
                feedback.style.borderColor = "var(--t-main)";
                feedback.style.boxShadow = "0 0 20px var(--t-main-glow)";
                
                document.getElementById('feedback-title').innerHTML = `<span style="color: var(--t-main);">${titleTxt}</span>`;
                document.getElementById('feedback-msg').innerHTML = msgTxt + tipHtml;
                btnContinue.style.backgroundColor = "var(--t-main)";
                btnContinue.onclick = () => awardXPAndNext();
                
                robot.innerText = '🦾🤖⚡';
                robot.className = "fixed right-6 bottom-10 text-[6rem] z-50 animate-robotHappy transition-all duration-300 pointer-events-none";
                robot.style.filter = "drop-shadow(0 0 15px var(--t-main))";
                
                let thunder = document.getElementById('thunder-overlay');
                thunder.classList.remove('animate-thunder'); void thunder.offsetWidth; thunder.classList.add('animate-thunder');
            } else {
                document.getElementById('game-card').classList.add('animate-shake');
                document.getElementById('game-card').style.borderColor = "#EF4444";
                feedback.style.backgroundColor = "#7F1D1D";
                feedback.style.borderColor = "#EF4444";
                feedback.style.boxShadow = "0 0 20px rgba(239,68,68,0.5)";
                
                document.getElementById('feedback-title').innerHTML = `<span class="text-red-500">${titleTxt}</span>`;
                document.getElementById('feedback-msg').innerHTML = msgTxt + tipHtml;
                btnContinue.style.backgroundColor = "#EF4444";
                
                robot.innerText = '💥🤖';
                robot.className = "fixed right-6 bottom-10 text-[5rem] z-50 animate-robotFall pointer-events-none";
                robot.style.filter = "none";

                btnContinue.onclick = () => {
                    document.getElementById('game-card').classList.remove('animate-shake');
                    if(generators[currentCategory].type === 'scenario') document.getElementById('mechanic-scenario').classList.remove('hidden-element');
                    if(generators[currentCategory].type === 'builder') document.getElementById('mechanic-builder').classList.remove('hidden-element');
                    retryFunc();
                };
            }
        }

        function awardXPAndNext() {
            updateStreak();
            progressData[currentCategory] = (progressData[currentCategory] || 0) + 1;
            progressData.totalXP += (generators[currentCategory].type === 'story') ? 50 : 10;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progressData));
            document.getElementById('total-xp-display').innerText = progressData.totalXP || 0;
            
            if(progressData[currentCategory] % DRILLS_PER_LEVEL === 0 && progressData[currentCategory] > 0) {
                updateGameUI(); // Show 5/5 before alert
                alert(`🎉 SYSTEM UPGRADE: You reached Level ${Math.floor(progressData[currentCategory] / DRILLS_PER_LEVEL) + 1} in ${generators[currentCategory].title}! 🎉`);
                showPath(currentCategory); 
                return;
            }
            updateGameUI();
            
            let cat = generators[currentCategory];
            if(cat.type === 'story') {
                document.getElementById('chat-history').innerHTML = '';
                currentStoryObj = getNextExercise(currentCategory); currentStoryIndex = 0;
                document.getElementById('chat-history').innerHTML = `<div class="chat-bubble-boss font-bold" style="color: var(--t-main);">${currentStoryObj.initPrompt}</div>`;
                loadStoryStep();
            } else if (cat.type === 'scenario') {
                document.getElementById('mechanic-scenario').classList.remove('hidden-element');
                loadScenario(getNextExercise(currentCategory));
            } else {
                loadBuilder(getNextExercise(currentCategory));
            }
        }

        renderDashboard();
    </script>
